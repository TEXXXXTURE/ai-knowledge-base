name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 质量门第 2 道（DESIGN-SPEC §7）：Schema 不过就不部署。
      # 放在最前面是为了快速失败——省掉后面 npm ci 和构建的开销。
      - name: Validate content schema
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate_content.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        # 注意：package.json 里的两个 *-linux-x64-gnu 可选依赖不是冗余，别删。
        # npm 的锁文件会剪掉「非当前平台」的 optional dependencies（npm/cli#4828），
        # 在 Windows 上生成的锁文件因此不含 Linux 原生二进制，
        # 但 CI runner 是 Linux —— npm ci 严格照锁文件装，就会缺
        # @astrojs/compiler-binding-linux-x64-gnu / lightningcss-linux-x64-gnu 而构建失败。
        # 登记成根级可选依赖后 npm 必须写进锁文件；Windows 本地因 os 不匹配自动跳过。

      # astro build 产出 dist，pagefind 随后在其中建立全站搜索索引
      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
